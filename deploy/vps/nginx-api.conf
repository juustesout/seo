# Reverse proxy for the SEO API behind Cloudflare (Full strict).
#
# Template only: this file is NOT applied automatically by the deploy pipeline.
# Install it on the VPS and follow deploy/README.md ("API origin").
#
# Why it exists: the browser talks same-origin https://oldskoolseo.com/api/* and
# Vercel proxies that server-side to https://api.peerdisco.com. Cloudflare
# terminates edge TLS and, in Full (strict) mode, requires a valid certificate on
# the origin's port 443. The VPS already has a Cloudflare Origin Certificate for
# *.peerdisco.com installed for another app, but its default 443 server block
# routes api.peerdisco.com to that other app. This block claims
# api.peerdisco.com on 443 and forwards to the API on 127.0.0.1:3001.
#
# Before installing, read the real certificate paths from the existing config:
#   sudo nginx -T | grep -nE 'ssl_certificate|ssl_certificate_key'
# and use those paths below (they are usually /etc/ssl/cloudflare/*.pem/.key).
#
# The API listens on 127.0.0.1:3001 and trusts X-Forwarded-* (app.ts sets
# `trust proxy`), so the proxy sets Host / X-Real-IP / X-Forwarded-* and
# forwards the original scheme.

# HTTP for this host: redirect to HTTPS (Cloudflare serves edge TLS anyway, but
# keeps direct-origin hits encrypted). The API is also reachable on port 80 for
# the default host, which this named block takes precedence over.
server {
    listen 80;
    listen [::]:80;
    server_name api.peerdisco.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.peerdisco.com;

    # Replace with the Cloudflare Origin Certificate paths already on the VPS.
    ssl_certificate     /etc/ssl/cloudflare/peerdisco.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/peerdisco.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Media (12mb raw) and knowledge uploads (12mb raw) must pass the proxy.
    # Keep this above the API's own limit so nginx is not the binding constraint.
    client_max_body_size 16m;

    # MCP over streamable HTTP: the GET stream is long-lived server-sent events.
    # Disable buffering and allow a long read so the stream is not cut off; the
    # API's own 30-minute session TTL bounds it.
    location /api/mcp {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
