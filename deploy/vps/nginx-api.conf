# Reverse proxy + TLS terminator for the SEO API (S7).
#
# Template only: this file is NOT applied automatically by the deploy pipeline.
# Install it on the VPS and follow the steps in deploy/README.md
# ("API origin"). This is the DNS-only + Let's Encrypt hardening path; the
# default Cloudflare-proxied setup needs no nginx change at all.
#
# Why it exists: the browser talks same-origin https://oldskoolseo.com/api/* and
# Vercel proxies that server-side. The rewrite target is a bare public origin, so
# without TLS the Supabase bearer token and every request body cross the
# Vercel-to-origin hop in cleartext. This proxy terminates TLS for the API host.
#
# The API listens on 127.0.0.1:3001 and trusts X-Forwarded-* (app.ts sets
# `trust proxy`), so the proxy must set Host / X-Real-IP / X-Forwarded-* and
# forward the original scheme.

# HTTP: only for the ACME challenge and the permanent redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.peerdisco.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.peerdisco.com;

    ssl_certificate     /etc/letsencrypt/live/api.peerdisco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.peerdisco.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Media (12mb raw) and knowledge uploads (12mb raw) must pass the proxy.
    # Keep this above the API's own limit so nginx is not the binding constraint.
    client_max_body_size 16m;

    # MCP over streamable HTTP: the GET stream is long-lived server-sent events.
    # Disable buffering and allow a long read so the stream is not cut off; the
    # API's own 30-minute session TTL bounds it.
    location /api/mcp {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
